<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart | Luscombe Herbals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg" />
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>

    <!-- Header (same) -->

    <main id="main">
        <section class="section">
            <div class="container" style="max-width:800px;">
                <h1 class="section-title">Your Cart</h1>

                <div style="background:var(--color-white); border-radius:var(--radius); border:1px solid var(--color-border); padding:var(--spacing-lg); margin-bottom:var(--spacing-lg);">
                    <p style="text-align:center; color:var(--color-text-light);">Your cart is currently empty.</p>
                    <p style="text-align:center; margin-top:var(--spacing-md);"><a href="products.html" class="btn btn-primary">Browse products</a></p>
                </div>

                <!-- Demo: if ?add=1 is in URL, show a sample item -->
                <div id="demoCart" style="display:none; background:var(--color-white); border-radius:var(--radius); border:1px solid var(--color-border); padding:var(--spacing-lg);">
                    <h2 style="font-size:1.2rem;">Cart items</h2>
                    <div style="display:flex; justify-content:space-between; align-items:center; padding:var(--spacing-md) 0; border-bottom:1px solid var(--color-border);">
                        <div>
                            <strong>Gumby Gumby</strong>
                            <span style="display:block; font-size:0.9rem; color:var(--color-text-light);">200 capsule pack</span>
                        </div>
                        <div>$40.00</div>
                    </div>
                    <div style="display:flex; justify-content:space-between; font-weight:600; padding:var(--spacing-md) 0;">
                        <span>Total</span>
                        <span>$40.00</span>
                    </div>
                    <a href="checkout.html" class="btn btn-primary" style="width:100%; text-align:center;">Proceed to checkout</a>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer (same) -->

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('add') !== null) {
                document.getElementById('demoCart').style.display = 'block';
                document.querySelector('.cart-count').textContent = '1';
            }
        });
    </script>
    <script src="script.js"></script>
</body>
</html>
